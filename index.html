<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>외딴 섬 (프로토타입)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a24; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; }
  #game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .panel { background: #f3d3a4; border: 3px solid #3d2c3a; border-radius: 4px; box-shadow: inset 0 -3px 0 #d9ae78; color: #3d2c3a; font-weight: 800; }
  #hud { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 170px); pointer-events: none; }
  .slot { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; font-size: 16px; }
  .slot img { width: 27px; height: 15px; image-rendering: pixelated; }
  .bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.2); } }
  #actions { position: absolute; left: 0; right: 0; bottom: 16px; padding: 0 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; pointer-events: none; }
  #night { position: absolute; inset: 0; background: #1d1a2e; opacity: 0; transition: opacity .8s; pointer-events: none; }
  #night.on { opacity: 1; pointer-events: auto; }
  #day { margin-right: 2px; }
  #actions button { pointer-events: auto; padding: 6px 12px; font-size: 15px; font-family: inherit; cursor: pointer; display: none; flex-direction: column; align-items: center; line-height: 1.2; white-space: nowrap; }
  #actions button small { font-size: 11px; opacity: .7; }
  #actions button:active { transform: translateY(2px); }
  #hunger { position: absolute; right: 8px; top: 8px; display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 14px; pointer-events: none; }
  #hunger .bar { width: 56px; height: 10px; background: #5a4a6a; border: 2px solid #3d2c3a; }
  #hunger .bar i { display: block; height: 100%; background: #f5b93a; }
  #hunger.low .bar i { background: #e8434a; }
  #hunger.low { animation: bump .6s infinite; }
  #reset { position: absolute; right: 8px; top: 46px; padding: 2px 8px; font-size: 11px; font-family: inherit; cursor: pointer; opacity: .85; }
  #toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); padding: 8px 14px; font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="144" height="256"></canvas>
  <div id="hud">
    <div class="slot panel" id="slot-log"><img id="icon-log" alt=""><span id="cnt-log">0</span></div>
    <div class="slot panel" id="slot-egg"><img id="icon-egg" alt="" style="width:18px;height:18px"><span id="cnt-egg">0</span></div>
    <div class="slot panel" id="slot-fried"><img id="icon-fried" alt="" style="width:21px;height:18px"><span id="cnt-fried">0</span></div>
    <div class="slot panel" id="slot-fish"><img id="icon-fish" alt=""><span id="cnt-fish">0</span></div>
    <div class="slot panel" id="slot-grilled"><img id="icon-grilled" alt=""><span id="cnt-grilled">0</span></div>
  </div>
  <div id="hunger" class="panel"><span id="day">1일째</span>배<div class="bar"><i id="hunger-fill"></i></div></div>

  <div id="actions">
    <button id="build" class="panel">모닥불<small>통나무 3</small></button>
    <button id="coop" class="panel">닭장<small>통나무 5</small></button>
    <button id="house" class="panel">집<small>통나무 8</small></button>
    <button id="sleep" class="panel">자기<small>밤 넘기기</small></button>
    <button id="eat" class="panel">먹기<small id="eat-what">구운 달걀</small></button>
  </div>
  <div id="night"></div>
  <div id="toast" class="panel"></div>

<script>
'use strict';

// ===== 1. 기본 =====
const W = 144, H = 256, TILE = 16;          // 내부 해상도 9 x 16 칸 (세로 화면)
const MAP_W = 18, MAP_H = 24;               // 섬 지도 칸 수
const CHECK = new URLSearchParams(location.search).has('check');   // index.html?check = dev/check.js 확인 모드
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function rng(seed) {
  return function () {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(20261017);   // 섬 모양을 매번 같게

// ===== 2. 팔레트 · 도트 =====
const PALETTE = {
  o: '#3d2c3a', // 외곽선
  w: '#fbfaf5', // 주인공 몸
  g: '#c9c6d6', // 주인공 그늘
  e: '#3d2c3a', // 눈
  t: '#a8693f', // 나무 껍질
  T: '#7a4a2e', // 나무 껍질 어두운 쪽
  c: '#ecc98f', // 자른 면
  r: '#c4905a', // 나이테
  l: '#4f9a7a', // 잎
  h: '#7cc27e', // 잎 밝은 쪽
  d: '#2f6b5e', // 잎 어두운 쪽
  R: '#e8434a', // 닭 볏
  Y: '#f5b93a', // 닭 부리 · 발
  E: '#fff3d6', // 달걀
  k: '#dcb77e', // 달걀 그늘
  B: '#ffe27a', // 병아리
  b: '#f0c24a', // 병아리 날개
  F: '#ff9a5a', // 물고기
  f: '#e86a3a', // 물고기 어두운 쪽
};
const C = {
  water: '#7ba4e0', waterDeep: '#6e97d8', foam: '#b4d0f2',
  grass: '#8fc95a', grassDark: '#78b24c', grassLight: '#a6d86a',
  dirt: '#b07a5c', dirtDark: '#98654b',
  cliff: '#9a6248', cliffDark: '#7a4a38',
  reed: '#5f8f4a', stone: '#9a9aa8',
  handle: '#8a5a3a', steel: '#c8ccd8',
};

function makeSprite(rows, colors = {}, flip = false) {
  const pal = { ...PALETTE, ...colors };
  const w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) console.warn('도트 줄 길이 다름', i, r); });
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = rows.length;
  const c = cv.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.' || !pal[ch]) return;
    c.fillStyle = pal[ch];
    c.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }));
  return cv;
}

// 주인공 11x11 — 오른쪽을 본다
const HERO = [
  '...ooooo...',
  '..owwwwwo..',
  '.owwwwwwwo.',
  'owwwwwwwwwo',
  'owwwwewwewo',
  'owwwwewwewo',
  'owwwwwwwwwo',
  'owwwwwwwwgo',
  '.owwwwwwgo.',
  '.owgo.owgo.',
  '..oo...oo..',
];

// 통나무 9x5
const LOG = [
  '.ooooooo.',
  'ottttttco',
  'otTtttTro',
  'oTTTTTTco',
  '.ooooooo.',
];

// 그루터기 10x6
const STUMP = [
  '..oooooo..',
  '.occrrcco.',
  '.oTccccTo.',
  '.otttttTo.',
  'ooTtttTToo',
  '.oooooooo.',
];

// 닭 11x10 — 오른쪽을 본다. 마지막 줄(발)만 바꿔서 걷기
const CHICKEN_TOP = [
  '......ooo..',
  '.....oRRRo.',
  '.....owwwo.',
  '.o...owewYo',
  'owo..owwRo.',
  'owwooowwo..',
  'owwwwwwwwo.',
  'owgwwwwwgo.',
  '.oggwwwggo.',
];
const CHICKEN_PECK = [   // 고개 숙여 쪼기
  '...........',
  '...........',
  '.o.........',
  'owo..ooo...',
  'owwoowwwooo',
  'owwwwwwwRRo',
  'owwwwwwwweo',
  'owgwwwwwwYo',
  '.oggwwwggo.',
  '....Y..Y...',
];
const CHICKEN_FEET = ['....Y..Y...', '...Y...Y...'];

// 병아리 7x7
const CHICK_TOP = [
  '..ooo..',
  '.oBBBo.',
  'oBBBBeo',
  'oBbBBBY',
  'oBbbBBo',
  '.oBBBo.',
];
const CHICK_FEET = ['..Y.Y..', '.Y...Y.'];

// 달걀 6x6
const EGG = [
  '..oo..',
  '.oEEo.',
  'oEEEEo',
  'oEEEko',
  'oEEkko',
  '.oooo.',
];

// 물고기 11x6 — 주황 바탕에 흰 줄
const FISH = [
  '..ooooo....',
  '.oFFwFFo.oo',
  'oFeFwFFFoFo',
  'oFFFwFFFFFo',
  '.ofFwffo.oo',
  '..ooooo....',
];

// 구운 달걀 7x6
const FRIED = [
  '.ooooo.',
  'oEEEEEo',
  'oEYYEEo',
  'oEYYEEo',
  'oEEEEko',
  '.ooooo.',
];

// 모닥불 장작 12x5
const FIRE_BASE = [
  '.oo......oo.',
  'oTToo..ooTTo',
  '.oTTToooTTo.',
  '..ooTTTTo...',
  '....oooo....',
];

// 소나무 17x22 — 3단 삼각형을 쌓고 가장자리를 외곽선으로 바꾼다
function pineRows() {
  const w = 17, h = 22, cx = 8;
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  [[0, 7, 4], [5, 7, 6], [10, 8, 7]].forEach(([top, th, maxHalf]) => {
    for (let i = 0; i < th; i++) {
      const half = Math.max(1, Math.round(maxHalf * (i + 1) / th));
      for (let x = cx - half; x <= cx + half; x++) {
        let ch = 'l';
        if (i === th - 1) ch = 'd';
        else if (x <= cx - half + 1) ch = 'h';
        else if (x >= cx + half - 1) ch = 'd';
        g[top + i][x] = ch;
      }
    }
  });
  for (let y = 18; y < h; y++) for (let x = cx - 2; x <= cx + 2; x++) g[y][x] = x === cx + 1 ? 'T' : 't';
  const filled = (x, y) => x >= 0 && y >= 0 && x < w && y < h && g[y][x] !== '.';
  return g.map((row, y) => row.map((ch, x) =>
    ch !== '.' && (!filled(x - 1, y) || !filled(x + 1, y) || !filled(x, y - 1) || !filled(x, y + 1)) ? 'o' : ch
  ).join(''));
}

const SPR = {
  hero: { right: makeSprite(HERO), left: makeSprite(HERO, {}, true) },
  tree: makeSprite(pineRows()),
  log: makeSprite(LOG),
  stump: makeSprite(STUMP),
  fireBase: makeSprite(FIRE_BASE),
  egg: makeSprite(EGG),
  fried: makeSprite(FRIED),
  fish: makeSprite(FISH),
  grilled: makeSprite(FISH, { F: '#d08850', f: '#8a4a2a', w: '#5a3a2a' }),   // 석쇠 자국
  chicken: {},
  chick: {},
};
['right', 'left'].forEach((side) => {
  const flip = side === 'left';
  SPR.chicken[side] = {
    stand: makeSprite([...CHICKEN_TOP, CHICKEN_FEET[0]], {}, flip),
    walk: makeSprite([...CHICKEN_TOP, CHICKEN_FEET[1]], {}, flip),
    peck: makeSprite(CHICKEN_PECK, {}, flip),
  };
  SPR.chick[side] = {
    stand: makeSprite([...CHICK_TOP, CHICK_FEET[0]], {}, flip),
    walk: makeSprite([...CHICK_TOP, CHICK_FEET[1]], {}, flip),
  };
});

// ===== 3. 그리기 도구 =====
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}
function disc(cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
    if (dx * dx + dy * dy <= r * r) ctx.fillRect(cx + dx, cy + dy, 1, 1);
}

// ===== 4. 섬 만들기 =====
// 0 = 물, 1 = 풀, 2 = 흙
const tiles = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(0));

function makeNoise(gw, gh) {
  const g = Array.from({ length: gh + 1 }, () => Array.from({ length: gw + 1 }, rand));
  const s = (v) => v * v * (3 - 2 * v);
  return (u, v) => {   // u, v = 0~1
    const x = u * gw, y = v * gh;
    const i = Math.min(gw - 1, Math.floor(x)), j = Math.min(gh - 1, Math.floor(y));
    const fx = s(x - i), fy = s(y - j);
    const a = g[j][i] + (g[j][i + 1] - g[j][i]) * fx;
    const b = g[j + 1][i] + (g[j + 1][i + 1] - g[j + 1][i]) * fx;
    return a + (b - a) * fy;
  };
}

function buildIsland() {
  const shape = makeNoise(5, 6), soil = makeNoise(4, 5);
  for (let j = 0; j < MAP_H; j++) for (let i = 0; i < MAP_W; i++) {
    if (i < 2 || j < 2 || i >= MAP_W - 2 || j >= MAP_H - 3) continue;
    const nx = (i + 0.5) / MAP_W * 2 - 1, ny = (j + 0.5) / MAP_H * 2 - 1;
    const d = Math.sqrt(nx * nx + ny * ny) + (shape(i / MAP_W, j / MAP_H) - 0.5) * 0.55;
    if (d < 0.74) tiles[j][i] = soil(i / MAP_W, j / MAP_H) > 0.66 ? 2 : 1;
  }
  // 외톨이 땅·구멍 정리
  for (let pass = 0; pass < 2; pass++) {
    for (let j = 1; j < MAP_H - 1; j++) for (let i = 1; i < MAP_W - 1; i++) {
      const n = [tiles[j - 1][i], tiles[j + 1][i], tiles[j][i - 1], tiles[j][i + 1]].filter((v) => v > 0).length;
      if (tiles[j][i] > 0 && n < 2) tiles[j][i] = 0;
      else if (tiles[j][i] === 0 && n >= 3) tiles[j][i] = 1;
    }
  }
}
buildIsland();

const isLand = (i, j) => i >= 0 && j >= 0 && i < MAP_W && j < MAP_H && tiles[j][i] > 0;
const landAt = (x, y) => isLand(Math.floor(x / TILE), Math.floor(y / TILE));

// 지도는 시작할 때 한 번만 굽는다
const mapCanvas = document.createElement('canvas');
mapCanvas.width = MAP_W * TILE;
mapCanvas.height = MAP_H * TILE;
const waves = [];

function bakeMap() {
  const m = mapCanvas.getContext('2d');
  const r = (x, y, w, h, color) => { m.fillStyle = color; m.fillRect(x, y, w, h); };
  r(0, 0, mapCanvas.width, mapCanvas.height, C.water);

  for (let j = 0; j < MAP_H; j++) for (let i = 0; i < MAP_W; i++) {
    const px = i * TILE, py = j * TILE, v = tiles[j][i];
    if (v === 0) {
      for (let k = 0; k < 3; k++) r(px + Math.floor(rand() * 14), py + Math.floor(rand() * 15), 2, 1, C.waterDeep);
      const nearLand = isLand(i - 1, j) || isLand(i + 1, j) || isLand(i, j - 1) || isLand(i, j + 1);
      if (!nearLand && rand() < 0.08) waves.push({ x: px + 3 + Math.floor(rand() * 8), y: py + 4 + Math.floor(rand() * 8), p: Math.floor(rand() * 60) });
      continue;
    }
    r(px, py, TILE, TILE, v === 2 ? C.dirt : C.grass);
    for (let k = 0; k < 6; k++) r(px + Math.floor(rand() * 15), py + Math.floor(rand() * 16), rand() < 0.5 ? 1 : 2, 1, v === 2 ? C.dirtDark : C.grassDark);
    if (v === 1) for (let k = 0; k < 2; k++) r(px + Math.floor(rand() * 15), py + Math.floor(rand() * 16), 1, 1, C.grassLight);
    if (v === 1 && rand() < 0.15) {   // 풀 포기
      const gx = px + 3 + Math.floor(rand() * 9), gy = py + 4 + Math.floor(rand() * 9);
      r(gx, gy, 1, 2, C.grassDark); r(gx + 1, gy + 1, 1, 1, C.grassDark); r(gx + 2, gy, 1, 2, C.grassDark);
    }
  }

  // 흙과 풀 경계를 톱니로
  for (let j = 0; j < MAP_H; j++) for (let i = 0; i < MAP_W; i++) {
    if (tiles[j][i] !== 2) continue;
    const px = i * TILE, py = j * TILE;
    for (let k = 0; k < TILE; k += 3) {
      if (tiles[j - 1]?.[i] === 1) r(px + k, py, 2, 1 + (k % 2), C.grass);
      if (tiles[j + 1]?.[i] === 1) r(px + k, py + 15 - (k % 2), 2, 1 + (k % 2), C.grass);
      if (tiles[j][i - 1] === 1) r(px, py + k, 1 + (k % 2), 2, C.grass);
      if (tiles[j][i + 1] === 1) r(px + 15 - (k % 2), py + k, 1 + (k % 2), 2, C.grass);
    }
  }

  // 물가: 위·옆은 외곽선, 아래는 흙 절벽
  for (let j = 0; j < MAP_H; j++) for (let i = 0; i < MAP_W; i++) {
    if (!isLand(i, j)) continue;
    const px = i * TILE, py = j * TILE;
    if (!isLand(i, j - 1)) { r(px, py - 1, TILE, 1, PALETTE.o); r(px, py, TILE, 1, C.grassLight); }
    if (!isLand(i - 1, j)) r(px - 1, py - 1, 1, TILE + 1, PALETTE.o);
    if (!isLand(i + 1, j)) r(px + TILE, py - 1, 1, TILE + 1, PALETTE.o);
    if (!isLand(i, j + 1)) {
      r(px, py + 15, TILE, 1, C.grassDark);
      r(px, py + 16, TILE, 5, C.cliff);
      for (let k = 1; k < TILE; k += 3) r(px + k, py + 17, 1, 3, C.cliffDark);
      r(px - (isLand(i - 1, j + 1) ? 0 : 1), py + 21, TILE + (isLand(i + 1, j + 1) ? 0 : 1) + (isLand(i - 1, j + 1) ? 0 : 1), 1, PALETTE.o);
      r(px, py + 22, TILE, 1, C.foam);
      if (!isLand(i - 1, j)) r(px - 1, py + 16, 1, 5, PALETTE.o);
      if (!isLand(i + 1, j)) r(px + TILE, py + 16, 1, 5, PALETTE.o);
    }
  }

  // 물풀 · 바위
  for (let j = 0; j < MAP_H; j++) for (let i = 0; i < MAP_W; i++) {
    if (isLand(i, j) || isLand(i, j - 1)) continue;
    const px = i * TILE, py = j * TILE, roll = rand();
    if (roll < 0.05) {
      for (let k = 0; k < 3; k++) {
        const h = 3 + ((k + i) % 2) * 2;
        r(px + 5 + k * 3, py + 11 - h, 1, h, C.reed);
        r(px + 5 + k * 3, py + 11, 1, 1, C.foam);
      }
    } else if (roll < 0.075) {
      r(px + 4, py + 7, 8, 5, PALETTE.o);
      r(px + 5, py + 8, 6, 3, C.stone);
      r(px + 5, py + 8, 3, 1, '#c4c4d0');
      r(px + 3, py + 12, 10, 1, C.foam);
    }
  }
}
bakeMap();

// ===== 5. 게임 상태 =====
function findSpawn() {
  const ci = MAP_W >> 1, cj = MAP_H >> 1;
  for (let rr = 0; rr < 10; rr++)
    for (let j = cj - rr; j <= cj + rr; j++) for (let i = ci - rr; i <= ci + rr; i++)
      if (tiles[j]?.[i] > 0 && isLand(i + 1, j) && isLand(i - 1, j) && isLand(i, j + 1)) return { i, j };
  return { i: ci, j: cj };
}
const spawn = findSpawn();

// 배부름
const FULL_MAX = 100, FULL_START = 80;
const FULL_DRAIN = FULL_MAX / (60 * 150);      // 가만히 있어도 2분 30초면 바닥
const FULL_PER_HIT = 1.5;                      // 도끼질 한 번
const FULL_PER_EGG = 35;
const FULL_PER_FISH = 50;

const player = { x: spawn.i * TILE + 8, y: spawn.j * TILE + 12, dir: 1, step: 0, moving: false, swing: 0, cool: 0, target: null, full: FULL_START, still: 0, fish: null };
const inv = { log: 0, egg: 0, fried: 0, fish: 0, grilled: 0 };
const trees = [];
const items = [];
const parts = [];
const fires = [];
const coops = [];
let house = null;   // 집은 하나
let day = 1;
let sleepCool = 0;
const chickens = [];
const cam = { x: 0, y: 0, shake: 0 };

function placeTrees() {
  for (let j = 1; j < MAP_H - 1; j++) for (let i = 1; i < MAP_W - 1; i++) {
    if (tiles[j][i] !== 1) continue;
    let ok = true;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) if (!isLand(i + di, j + dj)) ok = false;
    if (!ok || Math.hypot(i - spawn.i, j - spawn.j) < 2.5) continue;
    if (trees.some((t) => t.i === i - 1 && t.j === j || t.i === i && t.j === j - 1)) continue;
    if (rand() < 0.2) trees.push({ i, j, x: i * TILE + 8 + Math.round(rand() * 4 - 2), y: j * TILE + 13, hp: 3, maxHp: 3, shake: 0, hpShow: 0, state: 'tree', regrow: 0 });
  }
}
placeTrees();

const SPEED = 0.9;
const REACH_X = 15, REACH_Y = 9;
const SWING_LEN = 24, HIT_AT = 10;
const REGROW = 60 * 40;

const CHICKEN_COUNT = 5;
const CHICKEN_SPEED = 0.35, CHICKEN_FLEE = 1.0;
const EGG_MIN = 60 * 12, EGG_MAX = 60 * 25;   // 알 낳는 간격 (프레임)
const HOUSE_COST = 8;
const SLEEP_COOL = 60 * 90;                    // 한 번 자고 나면 이만큼은 다시 못 잔다
const SLEEP_HUNGER = 15;                       // 자고 일어나면 배가 이만큼 꺼져 있다
const NIGHT_EGG_LIMIT = 12;                    // 밤사이 낳는 알은 땅에 이만큼까지
const COOP_COST = 5;                           // 닭장 통나무
const COOP_SPAWN = 60 * 30;                    // 닭장 하나가 병아리를 내보내는 간격
const COOP_ROOM = 4;                           // 닭장 하나당 늘어나는 닭 수
const GROW_TIME = 60 * 40;                     // 병아리가 닭이 되는 시간
const EGG_LIMIT = 6;                           // 땅에 깔린 알이 이만큼이면 더 안 낳는다
const COOK_TIME = 120;                         // 달걀 하나 굽는 시간 (프레임)
const COOK_REACH = 18;
const COOK = {   // 날것 → 구운 것
  egg: { out: 'fried', time: COOK_TIME },
  fish: { out: 'grilled', time: 180 },
};

const FISH_STILL = 30;                         // 이만큼 가만히 서 있으면 낚싯대를 던진다
const FISH_WAIT_MIN = 60 * 2, FISH_WAIT_MAX = 60 * 5;
const FISH_BITE = 50;                          // 찌가 들어가 있는 시간. 이 안에 눌러야 잡힌다
const fishWait = () => FISH_WAIT_MIN + Math.floor(rand() * (FISH_WAIT_MAX - FISH_WAIT_MIN));
const nextEgg = () => EGG_MIN + Math.floor(rand() * (EGG_MAX - EGG_MIN));

function placeChickens() {
  for (let tries = 0; chickens.length < CHICKEN_COUNT && tries < 400; tries++) {
    const x = player.x + Math.round((rand() * 2 - 1) * 70), y = player.y + Math.round((rand() * 2 - 1) * 70);
    if (chickenBlocked(x, y) || Math.hypot(x - player.x, y - player.y) < 20) continue;
    chickens.push({ x, y, dir: rand() < 0.5 ? 1 : -1, state: 'idle', timer: Math.floor(rand() * 90), tx: x, ty: y, step: 0, egg: nextEgg() });
  }
}
placeChickens();

// ===== 6. 입력 =====
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); reel(); }
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

let joy = null;
let scale = 1;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  if (reel()) return;   // 낚시 중이면 톡 = 당기기
  joy = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', (e) => { if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
addEventListener('pointerup', (e) => { if (joy && e.pointerId === joy.id) joy = null; });
addEventListener('pointercancel', () => { joy = null; });

const JOY_R = 36;   // 화면 px
function readInput() {
  let vx = 0, vy = 0;
  if (keys.arrowleft || keys.a) vx -= 1;
  if (keys.arrowright || keys.d) vx += 1;
  if (keys.arrowup || keys.w) vy -= 1;
  if (keys.arrowdown || keys.s) vy += 1;
  if (vx || vy) { const l = Math.hypot(vx, vy); return { vx: vx / l, vy: vy / l }; }
  if (joy) {
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, l = Math.hypot(dx, dy);
    if (l > 6) { const k = Math.min(1, l / JOY_R) / l; return { vx: dx * k, vy: dy * k }; }
  }
  return { vx: 0, vy: 0 };
}

// ===== 7. 충돌 =====
function obstacles() {
  const list = [];
  trees.forEach((t) => list.push({ x: t.x, y: t.y, hw: 4 }));   // 그루터기도 막는다
  fires.forEach((f) => list.push({ x: f.x, y: f.y, hw: 5 }));
  coops.forEach((c) => list.push({ x: c.x, y: c.y, hw: 12, top: 10, bottom: 2 }));
  if (house) list.push({ x: house.x, y: house.y, hw: 16, top: 13, bottom: 2 });
  return list;
}
function blocked(x, y) {
  if (!landAt(x - 3, y - 2) || !landAt(x + 3, y - 2) || !landAt(x - 3, y) || !landAt(x + 3, y)) return true;
  return obstacles().some((o) => Math.abs(x - o.x) < o.hw + 3 && y > o.y - (o.top ?? 3) && y < o.y + (o.bottom ?? 3));
}
function tryMove(dx, dy) {
  if (!blocked(player.x + dx, player.y)) player.x += dx;
  if (!blocked(player.x, player.y + dy)) player.y += dy;
}
// 닭은 물가에서 한 칸 더 안쪽까지만 다닌다 (절벽에 붙지 않게)
function chickenBlocked(x, y) {
  if (!landAt(x - 5, y - 4) || !landAt(x + 5, y - 4) || !landAt(x - 5, y + 2) || !landAt(x + 5, y + 2)) return true;
  return obstacles().some((o) => Math.abs(x - o.x) < o.hw + 4 && y > o.y - (o.top ?? 3) - 1 && y < o.y + (o.bottom ?? 3) + 1);
}

// ===== 8. 갱신 =====
function nearestTree() {
  let best = null, bestD = 1e9;
  trees.forEach((t) => {
    if (t.state !== 'tree') return;
    const dx = t.x - player.x, dy = t.y - player.y;
    if (Math.abs(dx) > REACH_X || Math.abs(dy) > REACH_Y) return;
    const d = Math.hypot(dx, dy);
    if (d < bestD) { best = t; bestD = d; }
  });
  return best;
}

function burst(x, y, colors, n, power = 1) {
  for (let k = 0; k < n; k++) parts.push({
    x, y, vx: (rand() * 2 - 1) * power, vy: -0.6 - rand() * 1.2 * power,
    g: 0.08, life: 26 + Math.floor(rand() * 14), age: 0, color: colors[k % colors.length], w: rand() < 0.5 ? 2 : 1,
  });
}

function hitTree(t) {
  if (!t || t.state !== 'tree') return;
  if (Math.abs(t.x - player.x) > REACH_X + 3 || Math.abs(t.y - player.y) > REACH_Y + 3) return;
  t.hp--;
  player.full = Math.max(0, player.full - FULL_PER_HIT);
  t.shake = 10;
  t.hpShow = 90;
  burst(t.x - player.dir * 4, t.y - 8, [PALETTE.l, PALETTE.h, PALETTE.c], 5);
  if (t.hp <= 0) {
    t.state = 'stump';
    t.regrow = REGROW;
    cam.shake = 5;
    burst(t.x, t.y - 12, [PALETTE.l, PALETTE.h, PALETTE.d, PALETTE.c], 12, 1.4);
    for (let k = 0; k < 2; k++) items.push({ kind: 'log', x: t.x, y: t.y + 3, z: 0, vz: 2.2, vx: (k ? 1 : -1) * (0.2 + rand() * 0.15), vy: 0.05 + rand() * 0.1, age: 0 });
  }
}

let toastTimer = 0;
function toast(msg, frames = 180) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  toastTimer = frames;
}

function refreshHud() {
  document.getElementById('cnt-log').textContent = inv.log;
  document.getElementById('cnt-egg').textContent = inv.egg;
  document.getElementById('cnt-fried').textContent = inv.fried;
  document.getElementById('cnt-fish').textContent = inv.fish;
  document.getElementById('cnt-grilled').textContent = inv.grilled;
  ['egg', 'fried', 'fish', 'grilled'].forEach((k) => {   // 0 개인 칸은 숨긴다
    document.getElementById('slot-' + k).style.display = inv[k] > 0 ? 'flex' : 'none';
  });
  document.getElementById('eat-what').textContent = inv.grilled > 0 ? '구운 생선' : '구운 달걀';
  document.getElementById('build').style.display = inv.log >= 3 ? 'flex' : 'none';
  document.getElementById('coop').style.display = inv.log >= COOP_COST ? 'flex' : 'none';
  document.getElementById('house').style.display = inv.log >= HOUSE_COST && !house ? 'flex' : 'none';
  document.getElementById('eat').style.display = inv.fried + inv.grilled > 0 ? 'flex' : 'none';
}
function bumpHud(kind) {
  const el = document.getElementById('slot-' + kind);
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

let t = 0;
const hints = [
  [30, '화면을 누른 채 끌어서 이동해요 (PC: 방향키)'],
  [300, '나무 옆에 서면 저절로 도끼질해요'],
];

let firstEgg = false;
const said = {};   // 한 번만 띄우는 안내
function sayOnce(key, msg) { if (!said[key]) { said[key] = true; toast(msg, 220); } }

let lastFullDraw = -1;
function updateHunger() {
  player.full = Math.max(0, player.full - FULL_DRAIN);
  const pct = Math.round(player.full);
  if (pct !== lastFullDraw) {
    lastFullDraw = pct;
    document.getElementById('hunger-fill').style.width = pct + '%';
    document.getElementById('hunger').classList.toggle('low', player.full < 25);
  }
  if (player.full < 25 && player.full > 0) sayOnce('hungry', inv.fried + inv.grilled ? '배고파요… 구운 달걀을 먹어요' : '배고파요… 달걀을 구워 먹어야겠다');
  if (player.full === 0) sayOnce('starving', '배가 너무 고파서 힘이 없어요');
}

// 모닥불 옆에 서 있으면 생선 → 달걀 순서로 하나씩 굽는다
function updateFire(f) {
  if (t % 10 === 0) parts.push({ x: f.x + Math.round(rand() * 4 - 2), y: f.y - 8, vx: (rand() - 0.5) * 0.3, vy: -0.4 - rand() * 0.3, g: 0, life: 40, age: 0, color: rand() < 0.5 ? '#ffb000' : '#ff7a3c', w: 1 });
  const near = Math.abs(player.x - f.x) < COOK_REACH && Math.abs(player.y - f.y) < COOK_REACH - 6;
  const raw = inv.fish > 0 ? 'fish' : inv.egg > 0 ? 'egg' : null;
  if (near && raw) sayOnce('cook', '모닥불 옆에 있으면 저절로 구워요');
  if (f.cook == null) {
    if (near && raw) { inv[raw]--; f.kind = raw; f.cook = 0; refreshHud(); }
    return;
  }
  if (++f.cook < COOK[f.kind].time) return;
  f.cook = null;
  items.push({ kind: COOK[f.kind].out, x: f.x, y: f.y + 2, z: 0, vz: 1.8, vx: (player.x < f.x ? -1 : 1) * 0.3, vy: 0.1, age: 0 });
  burst(f.x, f.y - 14, ['#ffe066', '#ffffff'], 6, 0.8);
}

// 닭: 서 있기 → 걷기 / 쪼기. 주인공이 뛰어들면 도망. 가끔 알을 낳는다
function updateChicken(ch) {
  const pdx = ch.x - player.x, pdy = ch.y - player.y, pd = Math.hypot(pdx, pdy);
  if (player.moving && pd < 14 && ch.state !== 'flee') {
    ch.state = 'flee';
    ch.timer = 40;
    ch.tx = ch.x + (pdx / (pd || 1)) * 30;
    ch.ty = ch.y + (pdy / (pd || 1)) * 30;
    burst(ch.x, ch.y - 6, ['#ffffff'], 2, 0.5);   // 깃털
  }

  if (ch.state === 'walk' || ch.state === 'flee') {
    const dx = ch.tx - ch.x, dy = ch.ty - ch.y, d = Math.hypot(dx, dy);
    const sp = ch.state === 'flee' ? CHICKEN_FLEE : CHICKEN_SPEED;
    if (Math.abs(dx) > 0.5) ch.dir = Math.sign(dx);
    let moved = false;
    if (d > 1) {
      const nx = ch.x + dx / d * sp, ny = ch.y + dy / d * sp;
      const stuck = chickenBlocked(ch.x, ch.y);   // 모닥불·다시 자란 나무에 끼었으면 빠져나오게 둔다
      if (stuck || !chickenBlocked(nx, ch.y)) { ch.x = nx; moved = true; }
      if (stuck || !chickenBlocked(ch.x, ny)) { ch.y = ny; moved = true; }
      ch.step++;
    }
    if (d <= 1 || !moved || --ch.timer <= 0) { ch.state = 'idle'; ch.timer = 40 + Math.floor(rand() * 100); }
  } else if (--ch.timer <= 0) {
    const roll = rand();
    if (roll < 0.55) {
      ch.state = 'walk';
      ch.timer = 200;
      ch.tx = ch.x + Math.round((rand() * 2 - 1) * 32);
      ch.ty = ch.y + Math.round((rand() * 2 - 1) * 24);
    } else if (roll < 0.85) {
      ch.state = 'peck';
      ch.timer = 30 + Math.floor(rand() * 30);
    } else {
      ch.state = 'idle';
      ch.timer = 60 + Math.floor(rand() * 60);
    }
  }

  if (ch.baby > 0) {
    if (--ch.baby === 0) {
      burst(ch.x, ch.y - 8, ['#ffffff', '#ffe066', PALETTE.R], 8, 0.8);
      sayOnce('grown', '병아리가 닭이 됐어요!');
    }
  } else if (--ch.egg <= 0) {
    ch.egg = nextEgg();
    if (items.filter((it) => it.kind === 'egg').length < EGG_LIMIT) {
      items.push({ kind: 'egg', x: ch.x - ch.dir * 4, y: ch.y + 1, z: 0, vz: 1.2, vx: -ch.dir * 0.2, vy: 0, age: 0 });
      ch.state = 'idle';
      ch.timer = 50;
      ch.laid = 40;
      if (!firstEgg) { firstEgg = true; toast('닭이 알을 낳았어요! 주워 볼까요'); }
    }
  }
  if (ch.laid > 0) ch.laid--;
}

// 닭장: 자리가 있으면 일정 간격으로 병아리가 나온다
function updateCoop(c) {
  if (chickens.length >= CHICKEN_COUNT + coops.length * COOP_ROOM) { c.timer = COOP_SPAWN; return; }
  if (--c.timer > 0) return;
  c.timer = COOP_SPAWN;
  spawnChick(c);
}

function spawnChick(c) {
  const x = c.x + Math.round(rand() * 6 - 3), y = c.y + 6;
  chickens.push({ x, y, dir: rand() < 0.5 ? 1 : -1, state: 'walk', timer: 60, tx: x + Math.round(rand() * 20 - 10), ty: y + 14, step: 0, egg: nextEgg(), baby: GROW_TIME });
  burst(x, y - 4, ['#ffe066', '#ffffff'], 6, 0.6);
  sayOnce('chick', '닭장에서 병아리가 나왔어요!');
}

// 낚시: 물가에 가만히 서 있으면 던지고, 찌가 들어갔을 때 톡 누르면 잡힌다
const waterAt = (x, y) => !landAt(x, y);
function fishingSpot() {
  // 바라보는 쪽 → 반대쪽 → 아래 → 위. 찌 자리와 그 둘레가 물이어야 한다 (절벽 위에 앉지 않게)
  for (const [dx, dy] of [[player.dir * 22, -2], [-player.dir * 22, -2], [0, 24], [0, -20]]) {
    const bx = Math.round(player.x + dx), by = Math.round(player.y + dy);
    if (waterAt(bx, by) && waterAt(bx - 4, by) && waterAt(bx + 4, by) && waterAt(bx, by - 7) && waterAt(bx, by + 4)) return { bx, by };
  }
  return null;
}

function splash(x, y, n = 4) {
  burst(x, y, [C.foam, '#ffffff'], n, 0.5);
}

function updateFishing() {
  const f = player.fish;
  if (player.moving || player.swing > 0) {
    if (f && f.state === 'bite') toast('물고기가 도망갔어요', 90);
    player.fish = null;
    player.still = 0;
    return;
  }
  if (!f) {
    if (++player.still < FISH_STILL || nearestTree()) return;
    const spot = fishingSpot();
    if (!spot) return;
    player.fish = { state: 'cast', timer: 20, ...spot };
    if (spot.bx !== Math.round(player.x)) player.dir = Math.sign(spot.bx - player.x);
    sayOnce('fishing', '물가에 서 있으면 낚시를 해요');
    return;
  }
  if (--f.timer > 0) return;
  if (f.state === 'cast') { f.state = 'wait'; f.timer = fishWait(); splash(f.bx, f.by); }
  else if (f.state === 'wait') { f.state = 'bite'; f.timer = FISH_BITE; splash(f.bx, f.by, 6); sayOnce('bite', '찌가 쏙! 화면을 톡 눌러요 (PC: 스페이스)'); }
  else if (f.state === 'bite') { f.state = 'miss'; f.timer = 50; toast('놓쳤다… 다시 기다려요', 90); }
  else { f.state = 'wait'; f.timer = fishWait(); }   // miss · got 다음엔 다시 기다린다
}

// 톡 눌렀을 때. 낚시 중이라 입력을 썼으면 true
function reel() {
  const f = player.fish;
  if (!f) return false;
  if (f.state === 'bite') {
    items.push({ kind: 'fish', x: f.bx, y: f.by, z: 0, vz: 2.4, vx: (player.x - f.bx) / 32, vy: (player.y - 2 - f.by) / 32, age: 30 });
    splash(f.bx, f.by, 10);
    f.state = 'got';
    f.timer = 60;
    return true;
  }
  if (f.state === 'wait') {
    f.timer = fishWait();
    toast('아직이에요. 찌가 쏙 들어갈 때 눌러요', 90);
    return true;
  }
  return f.state !== 'cast' ? true : false;
}

// 집 문 앞에 서 있나
function atDoor() {
  return !!house && Math.abs(player.x - house.x) < 9 && player.y > house.y && player.y < house.y + 14;
}

// 밤이 지나는 동안 일어나는 일
function passNight() {
  day++;
  trees.forEach((tr) => { if (tr.state === 'stump') { tr.state = 'tree'; tr.hp = tr.maxHp; } });
  chickens.forEach((ch) => {
    if (ch.baby > 0) { ch.baby = 0; return; }   // 병아리는 하룻밤 자고 나면 닭
    if (items.filter((it) => it.kind === 'egg').length < NIGHT_EGG_LIMIT) {
      items.push({ kind: 'egg', x: ch.x - ch.dir * 4, y: ch.y + 1, z: 0, vz: 0, vx: 0, vy: 0, age: 30 });
    }
    ch.egg = nextEgg();
  });
  coops.forEach((c) => {
    if (chickens.length < CHICKEN_COUNT + coops.length * COOP_ROOM) spawnChick(c);
    c.timer = COOP_SPAWN;
  });
  player.full = Math.max(0, player.full - SLEEP_HUNGER);
  player.x = house.x;
  player.y = house.y + 8;
  player.fish = null;
  player.still = 0;
  sleepCool = SLEEP_COOL;
  refreshDay();
  refreshHud();
  saveGame();
}

let sleeping = false;
function goToSleep() {
  if (sleeping || !atDoor()) return;
  if (sleepCool > 0) { toast('아직 졸리지 않아요. 조금 더 놀다 자요'); return; }
  sleeping = true;
  document.getElementById('sleep').style.display = 'none';
  document.getElementById('night').classList.add('on');
  setTimeout(() => {
    passNight();
    cam.x = Math.max(0, Math.min(MAP_W * TILE - W, player.x - W / 2));
    cam.y = Math.max(0, Math.min(MAP_H * TILE - H, player.y - H / 2));
    setTimeout(() => {
      document.getElementById('night').classList.remove('on');
      toast(day + '일째 아침이 밝았어요');
      setTimeout(() => { sleeping = false; }, 800);
    }, 500);
  }, 900);
}

function refreshDay() {
  document.getElementById('day').textContent = day + '일째';
}

let lastAtDoor = null;
function update() {
  if (sleeping) return;
  hints.forEach(([at, msg]) => { if (t === at) toast(msg, 220); });
  if (toastTimer > 0 && --toastTimer === 0) document.getElementById('toast').classList.remove('show');

  const { vx, vy } = readInput();
  player.moving = !!(vx || vy);
  if (player.moving) {
    if (Math.abs(vx) > 0.2) player.dir = Math.sign(vx);
    const sp = player.full > 0 ? SPEED : SPEED * 0.5;
    tryMove(vx * sp, vy * sp);
    player.step++;
  }

  // 자동 도끼질
  if (player.swing > 0) {
    player.swing++;
    if (player.target && Math.abs(player.target.x - player.x) > 2) player.dir = Math.sign(player.target.x - player.x);
    if (player.swing === HIT_AT) hitTree(player.target);
    if (player.swing >= SWING_LEN) { player.swing = 0; player.cool = player.full > 0 ? 6 : 40; }
  } else if (player.cool > 0) {
    player.cool--;
  } else {
    const tr = nearestTree();
    if (tr) { player.target = tr; player.swing = 1; }
  }

  updateFishing();

  trees.forEach((tr) => {
    if (tr.shake > 0) tr.shake--;
    if (tr.hpShow > 0) tr.hpShow--;
    if (tr.state === 'stump' && --tr.regrow <= 0) {
      if (Math.abs(player.x - tr.x) < 12 && Math.abs(player.y - tr.y) < 8) { tr.regrow = 60; return; }
      tr.state = 'tree';
      tr.hp = tr.maxHp;
      burst(tr.x, tr.y - 10, [PALETTE.h, PALETTE.l], 8);
    }
  });

  chickens.forEach(updateChicken);

  // 통나무 · 달걀: 튀어 올랐다 떨어지고, 가까우면 빨려 온다
  for (let k = items.length - 1; k >= 0; k--) {
    const it = items[k];
    it.age++;
    if (it.z > 0 || it.vz > 0) {
      it.x += it.vx; it.y += it.vy;
      it.z += it.vz; it.vz -= 0.15;
      if (it.z <= 0) { it.z = 0; it.vz = Math.abs(it.vz) > 0.8 ? -it.vz * 0.4 : 0; it.vx *= 0.5; it.vy *= 0.5; }
      continue;
    }
    if (it.age < 30) continue;
    const dx = player.x - it.x, dy = player.y - 2 - it.y, d = Math.hypot(dx, dy);
    if (d < 4) {
      items.splice(k, 1);
      inv[it.kind]++;
      refreshHud();
      bumpHud(it.kind);
      burst(player.x, player.y - 12, ['#ffe066', '#ffffff'], 4, 0.6);
      if (it.kind === 'log' && inv.log === 3 && !fires.length) toast('통나무 3개! 모닥불을 만들 수 있어요');
      if (it.kind === 'log' && inv.log === COOP_COST && !coops.length) sayOnce('coopReady', '통나무 5개! 닭장을 지을 수 있어요');
      if (it.kind === 'fried') sayOnce('fried', '구운 달걀! 아래 버튼으로 먹을 수 있어요');
      if (it.kind === 'fish') sayOnce('gotfish', '물고기를 낚았다! 모닥불에 구우면 든든해요');
    } else if (d < 28) {
      const sp = Math.min(d, 1.2 + (28 - d) * 0.08);
      it.x += dx / d * sp; it.y += dy / d * sp;
    }
  }

  fires.forEach(updateFire);
  coops.forEach(updateCoop);
  if (sleepCool > 0) sleepCool--;
  const door = atDoor();
  if (door !== lastAtDoor) {
    lastAtDoor = door;
    document.getElementById('sleep').style.display = door ? 'flex' : 'none';
    if (door) sayOnce('door', '집 앞에서 자면 밤이 지나가요');
  }
  if (house && t % 25 === 0) parts.push({ x: house.x + 9 + Math.round(rand() * 2), y: house.y - 35, vx: 0.1 + rand() * 0.15, vy: -0.25, g: 0, life: 70, age: 0, color: '#d8d8e4', w: 2 });   // 굴뚝 연기
  updateHunger();

  parts.forEach((p) => { p.age++; p.x += p.vx; p.y += p.vy; p.vy += p.g; });
  for (let k = parts.length - 1; k >= 0; k--) if (parts[k].age >= parts[k].life) parts.splice(k, 1);

  // 카메라는 주인공을 천천히 따라간다
  const tx = Math.max(0, Math.min(MAP_W * TILE - W, player.x - W / 2));
  const ty = Math.max(0, Math.min(MAP_H * TILE - H, player.y - H / 2));
  cam.x += (tx - cam.x) * 0.15;
  cam.y += (ty - cam.y) * 0.15;
  if (cam.shake > 0) cam.shake--;
  if (t > 0 && t % SAVE_EVERY === 0) saveGame();
}

// ===== 9. 그리기 =====
function drawAxe(x, feet, dir, pose) {
  // dx 는 오른쪽을 볼 때 기준. 왼쪽이면 뒤집는다
  const p = (dx, dy, w, h, color) => rect(dir > 0 ? x + dx : x - dx - w + 1, feet + dy, w, h, color);
  if (pose === 'up') {           // 머리 뒤로 치켜듦
    p(-1, -17, 3, 10, PALETTE.o); p(0, -16, 1, 8, C.handle);
    p(-4, -18, 4, 5, PALETTE.o); p(-3, -17, 2, 3, C.steel);
  } else if (pose === 'strike') { // 앞으로 내리침
    p(4, -6, 10, 3, PALETTE.o); p(5, -5, 8, 1, C.handle);
    p(11, -7, 4, 7, PALETTE.o); p(12, -6, 2, 5, C.steel); p(12, -2, 2, 1, '#ffffff');
  } else {                       // 들고 있기
    p(3, -11, 3, 9, PALETTE.o); p(4, -10, 1, 7, C.handle);
    p(5, -12, 4, 5, PALETTE.o); p(5, -11, 3, 3, C.steel); p(7, -11, 1, 3, '#ffffff');
  }
}

function drawPlayer() {
  const x = Math.round(player.x), feet = Math.round(player.y);
  const bob = player.moving && Math.floor(player.step / 8) % 2 ? -1 : 0;
  const pose = player.swing === 0 ? 'idle' : player.swing < HIT_AT ? 'up' : 'strike';
  ctx.globalAlpha = 0.2;
  rect(x - 4, feet, 9, 1, PALETTE.o);
  ctx.globalAlpha = 1;
  if (player.fish) { drawFishing(x, feet); return; }
  if (pose === 'up') drawAxe(x, feet + bob, player.dir, pose);
  ctx.drawImage(SPR.hero[player.dir > 0 ? 'right' : 'left'], x - 5, feet - 10 + bob);
  if (pose !== 'up') drawAxe(x, feet + bob, player.dir, pose);
}

function line(x0, y0, x1, y1, color) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  ctx.fillStyle = color;
  for (;;) {
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function drawFishing(x, feet) {
  const f = player.fish;
  const d = f.bx > x + 2 ? 1 : f.bx < x - 2 ? -1 : player.dir;   // 낚싯대는 찌 쪽으로
  ctx.drawImage(SPR.hero[d > 0 ? 'right' : 'left'], x - 5, feet - 10);
  const hx = x + d * 4, hy = feet - 4;              // 손
  const tx = x + d * 13, ty = feet - 17;            // 낚싯대 끝
  line(hx, hy, tx, ty, PALETTE.T);
  line(hx - d, hy, tx - d, ty, C.handle);
  let bx = f.bx, by = f.by;
  if (f.state === 'cast') {                          // 날아가는 중: 끝에서 찌 자리까지 포물선
    const k = 1 - f.timer / 20;
    bx = tx + (f.bx - tx) * k;
    by = ty + (f.by - ty) * k - Math.sin(k * Math.PI) * 12;
  } else if (f.state === 'bite') {
    by += 2;                                         // 찌가 쏙
    if (Math.floor(f.timer / 4) % 2) rect(bx - 4, f.by + 1, 9, 1, C.foam);
  } else if (f.state !== 'got') {
    by += Math.floor(t / 30) % 2;                    // 둥실둥실
  }
  if (f.state !== 'got') {
    line(tx, ty, bx, by - 3, '#f4f4f4');
    rect(bx - 1, by - 3, 3, 2, '#e8434a');
    rect(bx - 1, by - 1, 3, 1, '#ffffff');
    if (f.state !== 'cast') rect(bx - 2, by, 5, 1, C.foam);
  }
  if (f.state === 'bite') {                          // 머리 위 느낌표
    rect(x - 1, feet - 25, 4, 8, PALETTE.o);
    rect(x, feet - 24, 2, 4, '#e8434a');
    rect(x, feet - 19, 2, 1, '#e8434a');
  }
}

function drawTree(tr) {
  const x = Math.round(tr.x), y = Math.round(tr.y);
  if (tr.state === 'stump') { ctx.drawImage(SPR.stump, x - 5, y - 5); return; }
  const sx = tr.shake > 0 ? (Math.floor(tr.shake / 2) % 2 ? 1 : -1) : 0;
  ctx.globalAlpha = 0.2;
  rect(x - 6, y, 13, 1, PALETTE.o);
  ctx.globalAlpha = 1;
  ctx.drawImage(SPR.tree, x - 8 + sx, y - 21);
}

function drawHpBar(tr) {
  if (tr.state !== 'tree' || tr.hpShow <= 0) return;
  const x = Math.round(tr.x) - 7, y = Math.round(tr.y) - 26;
  rect(x, y, 14, 4, PALETTE.o);
  rect(x + 1, y + 1, 12, 2, '#5a4a6a');
  rect(x + 1, y + 1, Math.round(12 * tr.hp / tr.maxHp), 2, '#e8434a');
}

function drawItem(it) {
  const x = Math.round(it.x), y = Math.round(it.y);
  const float = it.z === 0 ? (Math.floor((t + it.age) / 20) % 2) : 0;
  ctx.globalAlpha = 0.2;
  rect(x - 3, y + 1, 7, 1, PALETTE.o);
  ctx.globalAlpha = 1;
  if (it.kind === 'egg') ctx.drawImage(SPR.egg, x - 3, y - 5 - Math.round(it.z) - float);
  else if (it.kind === 'fried') ctx.drawImage(SPR.fried, x - 3, y - 5 - Math.round(it.z) - float);
  else if (it.kind === 'fish' || it.kind === 'grilled') ctx.drawImage(SPR[it.kind], x - 5, y - 5 - Math.round(it.z) - float);
  else ctx.drawImage(SPR.log, x - 4, y - 4 - Math.round(it.z) - float);
}

function drawChicken(ch) {
  const x = Math.round(ch.x), y = Math.round(ch.y);
  const baby = ch.baby > 0;
  const set = (baby ? SPR.chick : SPR.chicken)[ch.dir > 0 ? 'right' : 'left'];
  const moving = ch.state === 'walk' || ch.state === 'flee';
  let img = set.stand;
  if (moving) img = Math.floor(ch.step / (ch.state === 'flee' ? 4 : 8)) % 2 ? set.walk : set.stand;
  else if (ch.state === 'peck') img = Math.floor(ch.timer / 8) % 2 ? (set.peck || set.walk) : set.stand;
  const hop = ch.state === 'flee' && Math.floor(ch.step / 4) % 2 ? -2 : 0;
  ctx.globalAlpha = 0.2;
  rect(x - (baby ? 2 : 4), y, baby ? 5 : 9, 1, PALETTE.o);
  ctx.globalAlpha = 1;
  if (baby) ctx.drawImage(img, x - 3, y - 6 + hop);
  else ctx.drawImage(img, x - 5, y - 9 + hop);
  if (ch.laid > 0 && Math.floor(ch.laid / 6) % 2) {   // 알 낳고 반짝
    rect(x, y - 14, 1, 3, '#ffb000');
    rect(x - 1, y - 13, 3, 1, '#ffb000');
  }
}

function flameLayer(cx, baseY, maxW, h, color, phase) {
  for (let i = 0; i < h; i++) {
    const w = Math.max(1, Math.round(maxW * Math.pow(1 - i / h, 0.7)));
    const off = Math.round(Math.sin(t * 0.25 + i * 0.8 + phase) * (i / h) * 1.5);
    rect(cx - Math.floor(w / 2) + off, baseY - i, w, 1, color);
  }
}

function drawFire(f) {
  const x = Math.round(f.x), y = Math.round(f.y);
  ctx.globalAlpha = 0.12 + (Math.floor(t / 8) % 2) * 0.03;
  disc(x, y - 4, 16, '#ffd36a');
  ctx.globalAlpha = 1;
  ctx.drawImage(SPR.fireBase, x - 6, y - 4);
  const h = 10 + (Math.floor(t / 7) % 2);
  flameLayer(x, y - 3, 7, h, '#e8503a', 0);
  flameLayer(x, y - 3, 5, h - 3, '#ff9a3c', 1.5);
  flameLayer(x, y - 3, 3, h - 6, '#ffe066', 3);
  if (f.cook != null) {   // 불 위의 달걀 + 진행 막대
    const shake = Math.floor(t / 6) % 2;
    rect(x - 5, y - 13, 11, 1, PALETTE.o);   // 석쇠
    const ck = COOK[f.kind];
    const img = SPR[f.cook > ck.time * 0.6 ? ck.out : f.kind];
    ctx.drawImage(img, x - (img.width >> 1) + shake, y - 13 - img.height);
    rect(x - 7, y - 25, 14, 4, PALETTE.o);
    rect(x - 6, y - 24, 12, 2, '#5a4a6a');
    rect(x - 6, y - 24, Math.round(12 * f.cook / ck.time), 2, '#f5b93a');
  }
}

// 집 38x34: 통나무 벽 + 문 + 창 두 개 + 파란 지붕 + 굴뚝
function drawHouse(h) {
  const x = Math.round(h.x), y = Math.round(h.y);
  ctx.globalAlpha = 0.2;
  rect(x - 17, y, 35, 2, PALETTE.o);
  ctx.globalAlpha = 1;
  rect(x + 7, y - 34, 6, 12, PALETTE.o);                    // 굴뚝 (지붕 뒤)
  rect(x + 8, y - 33, 4, 11, '#9a9aa8');
  rect(x + 8, y - 33, 4, 1, '#c4c4d0');
  rect(x - 15, y - 18, 30, 19, PALETTE.o);                  // 벽
  rect(x - 14, y - 17, 28, 17, '#d9a066');
  for (let k = 0; k < 4; k++) rect(x - 14, y - 14 + k * 4, 28, 1, '#b07a48');
  [x - 12, x + 6].forEach((wx) => {                         // 창
    rect(wx, y - 14, 7, 6, PALETTE.o);
    rect(wx + 1, y - 13, 5, 4, '#9fd3f0');
    rect(wx + 1, y - 13, 2, 1, '#ffffff');
    rect(wx + 3, y - 13, 1, 4, PALETTE.o);
  });
  rect(x - 4, y - 11, 9, 12, PALETTE.o);                    // 문
  rect(x - 3, y - 10, 7, 11, '#7a4a2e');
  rect(x - 3, y - 10, 7, 1, '#9a6248');
  rect(x + 2, y - 5, 1, 1, '#ffe066');
  for (let i = 0; i <= 13; i++) rect(x - 19 + i, y - 19 - i, 38 - i * 2, 1, PALETTE.o);   // 지붕
  for (let i = 0; i < 13; i++) rect(x - 18 + i, y - 19 - i, 36 - i * 2, 1, i % 3 === 2 ? '#4a669a' : '#5f7fb8');
  rect(x - 18, y - 19, 36, 1, '#3d4f78');
}

// 닭장 26x26: 판자 벽 + 문 + 빨간 지붕
function drawCoop(c) {
  const x = Math.round(c.x), y = Math.round(c.y);
  ctx.globalAlpha = 0.2;
  rect(x - 13, y, 27, 2, PALETTE.o);
  ctx.globalAlpha = 1;
  rect(x - 12, y - 14, 24, 15, PALETTE.o);                  // 벽
  rect(x - 11, y - 13, 22, 13, '#c98a5a');
  for (let k = 0; k < 4; k++) rect(x - 11, y - 11 + k * 3, 22, 1, '#a86e45');
  rect(x - 4, y - 9, 8, 10, PALETTE.o);                     // 문
  rect(x - 3, y - 8, 6, 9, '#5a3a4a');
  rect(x - 3, y - 2, 6, 3, '#e8c25a');                      // 짚
  rect(x - 2, y - 3, 1, 1, '#e8c25a'); rect(x + 1, y - 3, 1, 1, '#e8c25a');
  for (let i = 0; i <= 10; i++) rect(x - 15 + i, y - 15 - i, 30 - i * 2, 1, PALETTE.o);   // 지붕
  for (let i = 0; i < 10; i++) rect(x - 14 + i, y - 15 - i, 28 - i * 2, 1, i % 3 === 2 ? '#9c3c3c' : '#c4524e');
  ctx.drawImage(SPR.egg, x - 3, y - 22);                    // 간판
}

function draw() {
  const sx = cam.shake ? Math.round(rand() * 2 - 1) : 0;
  const cx = Math.round(cam.x) + sx, cy = Math.round(cam.y);
  ctx.save();
  ctx.drawImage(mapCanvas, cx, cy, W, H, 0, 0, W, H);
  ctx.translate(-cx, -cy);

  waves.forEach((wv) => {
    if (wv.x < cx - 8 || wv.x > cx + W + 8 || wv.y < cy - 8 || wv.y > cy + H + 8) return;
    const ph = Math.floor((t + wv.p) / 30) % 2;
    rect(wv.x + ph, wv.y, 3, 1, C.foam);
    rect(wv.x + 4 - ph, wv.y + 2, 2, 1, C.foam);
  });

  // y 가 큰(아래쪽) 것을 나중에 그려 앞에 보이게
  const list = [];
  trees.forEach((tr) => list.push({ y: tr.y, f: () => drawTree(tr) }));
  fires.forEach((f) => list.push({ y: f.y, f: () => drawFire(f) }));
  coops.forEach((c) => list.push({ y: c.y, f: () => drawCoop(c) }));
  if (house) list.push({ y: house.y, f: () => drawHouse(house) });
  items.forEach((it) => list.push({ y: it.y, f: () => drawItem(it) }));
  chickens.forEach((ch) => list.push({ y: ch.y, f: () => drawChicken(ch) }));
  list.push({ y: player.y + 0.5, f: drawPlayer });
  list.sort((a, b) => a.y - b.y).forEach((e) => e.f());

  parts.forEach((p) => {
    ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
    rect(p.x, p.y, p.w, 1, p.color);
  });
  ctx.globalAlpha = 1;
  trees.forEach(drawHpBar);
  ctx.restore();

  if (joy) {   // 가상 조이스틱
    const r = canvas.getBoundingClientRect();
    const bx = Math.round((joy.sx - r.left) / scale), by = Math.round((joy.sy - r.top) / scale);
    let dx = (joy.x - joy.sx) / scale, dy = (joy.y - joy.sy) / scale;
    const l = Math.hypot(dx, dy), max = JOY_R / scale;
    if (l > max) { dx = dx / l * max; dy = dy / l * max; }
    ctx.globalAlpha = 0.3;
    disc(bx, by, 12, '#ffffff');
    ctx.globalAlpha = 0.7;
    disc(Math.round(bx + dx), Math.round(by + dy), 5, '#ffffff');
    ctx.globalAlpha = 1;
  }
}

// ===== 10. 짓기 =====
// 발밑 기준 (x, y) 에서 좌우 hw, 위 top, 아래 bottom 만큼이 땅이고 다른 것과 안 겹치나
function areaFree(x, y, hw, top, bottom) {
  if (![[-hw, -top], [hw, -top], [-hw, bottom], [hw, bottom]].every(([dx, dy]) => landAt(x + dx, y + dy))) return false;
  return obstacles().every((o) => Math.abs(x - o.x) >= hw + o.hw + 2
    || y + bottom <= o.y - (o.top ?? 3) || y - top >= o.y + (o.bottom ?? 3));
}

document.getElementById('house').addEventListener('click', () => {
  if (inv.log < HOUSE_COST || house) return;
  const x = Math.round(player.x + player.dir * 28), y = Math.round(player.y + 4);
  if (!areaFree(x, y, 17, 15, 12)) { toast('집은 아주 넓은 빈 땅이 필요해요'); return; }
  inv.log -= HOUSE_COST;
  house = { x, y };
  cam.shake = 6;
  burst(x, y - 12, ['#d9a066', '#5f7fb8', '#ffffff'], 18, 1.6);
  lastAtDoor = null;
  refreshHud();
  toast('집 완성! 문 앞에 서면 잘 수 있어요');
});
document.getElementById('sleep').addEventListener('click', goToSleep);

document.getElementById('coop').addEventListener('click', () => {
  if (inv.log < COOP_COST) return;
  const x = Math.round(player.x + player.dir * 24), y = Math.round(player.y + 4);
  if (!areaFree(x, y, 13, 12, 8)) { toast('닭장은 넓은 빈 땅이 필요해요'); return; }
  inv.log -= COOP_COST;
  coops.push({ x, y, timer: 60 * 5 });   // 첫 병아리는 금방 나온다
  cam.shake = 4;
  burst(x, y - 10, ['#c98a5a', '#c4524e', '#ffffff'], 14, 1.4);
  refreshHud();
  toast('닭장 완성! 곧 병아리가 나올 거예요');
});

document.getElementById('build').addEventListener('click', () => {
  if (inv.log < 3) return;
  const x = Math.round(player.x + player.dir * 14), y = Math.round(player.y);
  const free = landAt(x - 6, y - 2) && landAt(x + 6, y - 2) && landAt(x - 6, y) && landAt(x + 6, y)
    && trees.every((tr) => Math.abs(tr.x - x) > 10 || Math.abs(tr.y - y) > 6)
    && fires.every((f) => Math.abs(f.x - x) > 12 || Math.abs(f.y - y) > 6)
    && coops.every((c) => Math.abs(c.x - x) > 19 || y < c.y - 12 || y > c.y + 5)
    && (!house || Math.abs(house.x - x) > 23 || y < house.y - 15 || y > house.y + 5);
  if (!free) { toast('여기엔 놓을 수 없어요. 빈 땅을 보고 눌러 주세요'); return; }
  inv.log -= 3;
  fires.push({ x, y });
  burst(x, y - 6, ['#ffe066', '#ff9a3c', '#ffffff'], 10, 1.2);
  refreshHud();
  toast(fires.length === 1 ? '모닥불 완성! 오늘 밤은 따뜻하겠다' : '모닥불을 하나 더 만들었어요');
});

document.getElementById('eat').addEventListener('click', () => {
  const food = inv.grilled > 0 ? 'grilled' : inv.fried > 0 ? 'fried' : null;
  if (!food) return;
  inv[food]--;
  player.full = Math.min(FULL_MAX, player.full + (food === 'grilled' ? FULL_PER_FISH : FULL_PER_EGG));
  said.hungry = said.starving = false;   // 다시 배고파지면 또 알려 준다
  burst(player.x, player.y - 12, ['#ffe066', '#ffffff', '#e8434a'], 8, 0.8);
  refreshHud();
  if (inv[food] > 0) bumpHud(food);
  toast(player.full >= FULL_MAX ? '배불러요!' : food === 'grilled' ? '생선 맛있다! 든든해' : '냠냠. 힘이 난다');
});

// ===== 11. 화면 맞추기 · 루프 =====
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  wrap.style.width = W * scale + 'px';
  wrap.style.height = H * scale + 'px';
}
addEventListener('resize', fit);
fit();

document.getElementById('icon-log').src = SPR.log.toDataURL();
document.getElementById('icon-egg').src = SPR.egg.toDataURL();
document.getElementById('icon-fried').src = SPR.fried.toDataURL();
document.getElementById('icon-fish').src = SPR.fish.toDataURL();
document.getElementById('icon-grilled').src = SPR.grilled.toDataURL();
// ===== 12. 저장 (localStorage) =====
// 접근은 전부 try/catch — 아이폰 프라이빗 모드에서는 예외가 난다 (dev-guide trouble.md 함정 2)
// SAVE_VER 는 함부로 올리지 않는다. 필드를 늘릴 때는 읽는 쪽에 기본값을 두어 옛 저장본도 읽히게 한다
const SAVE_KEY = CHECK ? 'island-save-check' : 'island-save';   // 확인 모드는 진짜 저장본을 건드리지 않는다
const SAVE_VER = 1;
const SAVE_EVERY = 60 * 5;
const ITEM_KINDS = ['log', 'egg', 'fried', 'fish', 'grilled'];
let noSave = false;   // 처음부터 누른 뒤 페이지를 떠날 때 다시 저장되지 않게

function saveGame() {
  if (noSave) return false;
  const data = {
    v: SAVE_VER,
    at: Date.now(),
    player: { x: Math.round(player.x), y: Math.round(player.y), dir: player.dir, full: Math.round(player.full * 10) / 10 },
    inv: { ...inv },
    trees: { n: trees.length, list: trees.map((tr) => [tr.state === 'tree' ? 1 : 0, tr.hp, tr.regrow]) },   // 섬은 시드로 똑같이 만들어지므로 순서로 맞춘다
    fires: fires.map((f) => ({ x: f.x, y: f.y, cook: f.cook ?? null, kind: f.kind ?? null })),
    coops: coops.map((c) => ({ x: c.x, y: c.y, timer: c.timer })),
    house: house ? { x: house.x, y: house.y } : null,
    day,
    sleepCool,
    chickens: chickens.map((ch) => ({ x: Math.round(ch.x), y: Math.round(ch.y), dir: ch.dir, egg: ch.egg, baby: ch.baby || 0 })),
    items: items.map((it) => ({ kind: it.kind, x: Math.round(it.x), y: Math.round(it.y) })),
    said: { ...said },
    firstEgg,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
}

function loadGame() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return false; }
  if (!d || typeof d !== 'object' || !d.player) return false;
  const num = (v, def) => (typeof v === 'number' && isFinite(v) ? v : def);
  const arr = (a) => (Array.isArray(a) ? a : []);

  const px = num(d.player.x, player.x), py = num(d.player.y, player.y);
  if (!blocked(px, py)) { player.x = px; player.y = py; }
  player.dir = d.player.dir === -1 ? -1 : 1;
  player.full = Math.max(0, Math.min(FULL_MAX, num(d.player.full, FULL_START)));
  Object.keys(inv).forEach((k) => { inv[k] = Math.max(0, Math.floor(num(d.inv?.[k], 0))); });

  if (d.trees?.n === trees.length) arr(d.trees.list).forEach((row, i) => {
    const tr = trees[i];
    if (!tr || !Array.isArray(row)) return;
    tr.state = row[0] ? 'tree' : 'stump';
    tr.hp = row[0] ? Math.max(1, Math.min(tr.maxHp, num(row[1], tr.maxHp))) : 0;
    tr.regrow = Math.max(0, num(row[2], REGROW));
  });

  fires.length = 0;
  arr(d.fires).forEach((f) => {
    const kind = COOK[f.kind] ? f.kind : null;
    fires.push({ x: num(f.x, 0), y: num(f.y, 0), kind, cook: kind && typeof f.cook === 'number' ? f.cook : null });
  });
  coops.length = 0;
  arr(d.coops).forEach((c) => coops.push({ x: num(c.x, 0), y: num(c.y, 0), timer: num(c.timer, COOP_SPAWN) }));
  if (arr(d.chickens).length) {
    chickens.length = 0;
    d.chickens.forEach((c) => {
      const x = num(c.x, player.x), y = num(c.y, player.y);
      chickens.push({ x, y, dir: c.dir === -1 ? -1 : 1, state: 'idle', timer: Math.floor(rand() * 90), tx: x, ty: y, step: 0, egg: num(c.egg, nextEgg()), baby: Math.max(0, num(c.baby, 0)) });
    });
  }
  items.length = 0;
  arr(d.items).forEach((it) => {
    if (ITEM_KINDS.includes(it.kind)) items.push({ kind: it.kind, x: num(it.x, player.x), y: num(it.y, player.y), z: 0, vz: 0, vx: 0, vy: 0, age: 30 });
  });
  Object.assign(said, d.said && typeof d.said === 'object' ? d.said : {});
  firstEgg = !!d.firstEgg;
  house = d.house && typeof d.house.x === 'number' && typeof d.house.y === 'number' ? { x: d.house.x, y: d.house.y } : null;
  day = Math.max(1, Math.floor(num(d.day, 1)));
  sleepCool = Math.max(0, num(d.sleepCool, 0));
  return true;
}

addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveGame(); });
addEventListener('pagehide', saveGame);

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('지금까지 한 것을 지우고 처음부터 할까요?')) return;
  noSave = true;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 지울 수 없으면 그냥 새로고침 */ }
  location.reload();
});

if (!CHECK && loadGame()) {
  hints.length = 0;   // 이어 하는 사람에게는 조작 안내를 다시 띄우지 않는다
  toast('이어서 할게요', 120);
}
refreshHud();
refreshDay();

cam.x = Math.max(0, Math.min(MAP_W * TILE - W, player.x - W / 2));
cam.y = Math.max(0, Math.min(MAP_H * TILE - H, player.y - H / 2));

function tick() { update(); t++; }   // 1/60 초 한 번

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(frame);
}
// 확인 모드는 루프를 돌리지 않는다. dev/check.js 가 tick() 을 직접 불러 매번 같은 결과가 나오게 한다
if (CHECK) {
  draw();
  const s = document.createElement('script');
  s.src = 'dev/check.js';
  document.body.appendChild(s);
} else requestAnimationFrame(frame);

window.game = { player, trees, items, inv, fires, coops, chickens, tiles, fishingSpot, refreshHud, saveGame, getHouse: () => house, getDay: () => day, setSleepCool: (v) => { sleepCool = v; } };   // 확인용
</script>
</body>
</html>
