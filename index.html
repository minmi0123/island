<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>외딴 섬 (프로토타입)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a24; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; }
  #game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .panel { background: #f3d3a4; border: 3px solid #3d2c3a; border-radius: 4px; box-shadow: inset 0 -3px 0 #d9ae78; color: #3d2c3a; font-weight: 800; }
  #hud { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 170px); pointer-events: none; }
  .slot { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; font-size: 16px; }
  .slot img { width: 27px; height: 15px; image-rendering: pixelated; }
  .bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.2); } }
  #actions { position: absolute; left: 0; right: 0; bottom: 16px; padding: 0 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; pointer-events: none; }
  #night { position: absolute; inset: 0; background: #1d1a2e; opacity: 0; transition: opacity .8s; pointer-events: none; }
  #night.on { opacity: 1; pointer-events: auto; }
  #actions button { pointer-events: auto; padding: 6px 12px; font-size: 15px; font-family: inherit; cursor: pointer; display: none; flex-direction: column; align-items: center; line-height: 1.2; white-space: nowrap; }
  #actions button small { font-size: 11px; opacity: .7; }
  #actions button:active { transform: translateY(2px); }
  #body { position: absolute; right: 8px; top: 8px; display: flex; align-items: center; gap: 5px; padding: 4px 8px; font-size: 13px; pointer-events: none; }
  #body .bar { width: 40px; height: 10px; background: #5a4a6a; border: 2px solid #3d2c3a; margin-right: 3px; }
  #body .bar i { display: block; height: 100%; background: #f5b93a; }
  #body #bar-hp i { background: #6cc26a; }
  #body .bar.low i { background: #e8434a !important; }
  #body .bar.low { animation: bump .6s infinite; }
  #menu { position: absolute; right: 8px; top: 46px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #menu button { padding: 2px 8px; font-size: 11px; font-family: inherit; cursor: pointer; opacity: .85; }
  #menu #bag-open { font-size: 13px; padding: 3px 10px; opacity: 1; }
  /* 일기: 줄 쳐진 종이 */
  .paper { background: #fbf3e0 repeating-linear-gradient(transparent 0 23px, #ead9b8 23px 24px) 0 10px; color: #3d2c3a; border: 3px solid #3d2c3a; border-radius: 4px; box-shadow: 0 4px 0 #0005; padding: 10px 14px 12px; font-size: 14px; line-height: 24px; word-break: keep-all; }
  .paper h2, .paper h3 { margin: 0; font-size: 15px; line-height: 24px; }
  .paper h3 { margin-top: 24px; color: #a8693f; }
  .paper h3:first-child { margin-top: 0; }
  .paper p { margin: 0; }
  .paper button { display: block; margin: 12px auto 0; padding: 4px 16px; font-size: 14px; font-family: inherit; font-weight: 800; cursor: pointer; }
  #bag { position: absolute; inset: 0; background: #1d1a2ecc; display: none; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; }
  #bag.on { display: flex; }
  #bag .paper { width: 100%; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background-image: none; }
  #bag h2 small { font-size: 12px; color: #8a6a5a; margin-left: 4px; }
  #bag-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 6px; overflow-y: auto; min-height: 0; flex: 0 1 auto; }
  .cell { aspect-ratio: 1; background: #f0e2c4; border: 2px solid #e2cfa6; border-radius: 3px; position: relative; display: flex; align-items: center; justify-content: center; }
  .cell img { image-rendering: pixelated; }
  .cell b { position: absolute; right: 2px; bottom: 0; font-size: 11px; line-height: 14px; }
  .cell.sel { border-color: #3d2c3a; background: #fff3d6; }
  #bag-info { min-height: 76px; margin-top: 8px; line-height: 18px; }
  #bag-info b { display: block; font-size: 15px; }
  #bag-info small { display: block; font-size: 12px; color: #8a6a5a; }
  .bag-buttons { display: flex; gap: 6px; margin-top: 6px; }
  .paper .bag-buttons button { margin: 0; padding: 4px 10px; font-size: 13px; }
  .bag-empty { color: #8a6a5a; }
  #choice, #ending { position: absolute; inset: 0; background: #1d1a2ecc; display: none; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; }
  #choice.on, #ending.on { display: flex; }
  #choice .paper { width: 100%; text-align: center; }
  #choice button { min-width: 150px; }
  #choice button small { display: block; font-size: 11px; font-weight: 700; opacity: .7; }
  #go:disabled { opacity: .5; cursor: default; }
  #ending .paper { width: 100%; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; background-image: none; padding: 8px; }
  #ending-card { display: block; width: 100%; min-height: 0; flex: 0 1 auto; object-fit: contain; }
  #ending .row { display: flex; gap: 8px; }
  #ending .row button { margin: 10px 0 0; }
  #toast { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); padding: 8px 14px; font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="144" height="256"></canvas>
  <div id="hud">
    <div class="slot panel" id="slot-log"><img id="icon-log" alt=""><span id="cnt-log">0</span></div>
    <div class="slot panel" id="slot-egg"><img id="icon-egg" alt="" style="width:18px;height:18px"><span id="cnt-egg">0</span></div>
    <div class="slot panel" id="slot-fried"><img id="icon-fried" alt="" style="width:21px;height:18px"><span id="cnt-fried">0</span></div>
    <div class="slot panel" id="slot-fish"><img id="icon-fish" alt=""><span id="cnt-fish">0</span></div>
    <div class="slot panel" id="slot-grilled"><img id="icon-grilled" alt=""><span id="cnt-grilled">0</span></div>
    <div class="slot panel" id="slot-meat"><img id="icon-meat" alt="" style="width:27px;height:17px"><span id="cnt-meat">0</span></div>
    <div class="slot panel" id="slot-roast"><img id="icon-roast" alt="" style="width:27px;height:17px"><span id="cnt-roast">0</span></div>
  </div>
  <div id="body" class="panel">체력<div class="bar" id="bar-hp"><i id="hp-fill"></i></div>배<div class="bar" id="bar-full"><i id="hunger-fill"></i></div></div>
  <div id="menu">
    <button id="bag-open" class="panel">가방</button>
    <button id="reset" class="panel">처음부터</button>
  </div>
  <div id="actions">
    <button id="build" class="panel">모닥불<small>통나무 3</small></button>
    <button id="coop" class="panel">닭장<small>통나무 5</small></button>
    <button id="house" class="panel">집<small>통나무 8</small></button>
    <button id="raft" class="panel">뗏목<small>터 잡기</small></button>
    <button id="leave" class="panel">떠날까?<small>뗏목</small></button>
    <button id="eat" class="panel">먹기<small id="eat-what">구운 달걀</small></button>
  </div>
  <div id="night"></div>
  <div id="bag">
    <div class="paper"><h2>가방<small id="bag-count"></small></h2><div id="bag-grid"></div><div id="bag-info"></div><button id="bag-close" class="panel">닫기</button></div>
  </div>
  <div id="choice">
    <div class="paper">
      <h2>뗏목이 다 됐다</h2><p id="choice-text"></p>
      <button id="go" class="panel">떠나기<small id="go-need"></small></button>
      <button id="later" class="panel">아직</button>
    </div>
  </div>
  <div id="ending">
    <div class="paper">
      <img id="ending-card" alt="엔딩 카드">
      <div class="row"><button id="ending-save" class="panel">이미지 저장</button><button id="ending-next" class="panel"></button></div>
    </div>
  </div>
  <div id="toast" class="panel"></div>
</div>
<script src="js/base.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/map.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/animals.js"></script>
<script src="js/fishing.js"></script>
<script src="js/body.js"></script>
<script src="js/stats.js"></script>
<script src="js/raft.js"></script>
<script src="js/ending.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/bag.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
</body>
</html>
